              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                  } catch (Exception ignored) {}
              }

              private void loadThemeColors() {
                  String th = "amber";
                  try {
                      th = getSharedPreferences("lankakey_prefs", Context.MODE_PRIVATE)
                          .getString("theme", "amber");
                  } catch (Exception ignored) {}

                  if ("emerald".equals(th)) {
                      colorBg = Color.parseColor("#022C22");
                      colorPrimary = Color.parseColor("#10B981");
                      colorKeyBg = Color.parseColor("#064E3B");
                      colorKeyText = Color.parseColor("#ECFDF5");
                      colorBorder = Color.parseColor("#047857");
                  } else if ("cyberpunk".equals(th)) {
                      colorBg = Color.parseColor("#09090B");
                      colorPrimary = Color.parseColor("#06B6D4");
                      colorKeyBg = Color.parseColor("#18181B");
                      colorKeyText = Color.parseColor("#F0FDFA");
                      colorBorder = Color.parseColor("#27272A");
                  } else if ("purple".equals(th)) {
                      colorBg = Color.parseColor("#1E1B4B");
                      colorPrimary = Color.parseColor("#8B5CF6");
                      colorKeyBg = Color.parseColor("#312E81");
                      colorKeyText = Color.parseColor("#EDE9FE");
                      colorBorder = Color.parseColor("#4338CA");
                  } else if ("amoled".equals(th)) {
                      colorBg = Color.parseColor("#000000");
                      colorPrimary = Color.parseColor("#F59E0B");
                      colorKeyBg = Color.parseColor("#111111");
                      colorKeyText = Color.parseColor("#FFFFFF");
                      colorBorder = Color.parseColor("#222222");
                  } else {
                      colorBg = Color.parseColor("#0F172A");
                      colorPrimary = Color.parseColor("#F59E0B");
                      colorKeyBg = Color.parseColor("#1E293B");
                      colorKeyText = Color.parseColor("#FFFFFF");
                      colorBorder = Color.parseColor("#334155");
                  }
              }

              @Override
              public void onStartInputView(EditorInfo info, boolean restarting) {
                  super.onStartInputView(info, restarting);
                  loadThemeColors();
                  if (rootLayout != null) {
                      rootLayout.setBackgroundColor(colorBg);
                      refreshKeypad();
                      updateSuggestions();
                  }
              }

              @Override
              public void onFinishInputView(boolean finishingInput) {
                  super.onFinishInputView(finishingInput);
                  stopRepeat();
                  if (buffer.length() > 0) {
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null) {
                          ic.finishComposingText();
                      }
                      buffer.setLength(0);
                  }
              }

              private void vibrate() {
                  if (vibrator != null) {
                      try { vibrator.vibrate(20); } catch (Exception ignored) {}
                  }
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP, value, getResources().getDisplayMetrics()
                  );
              }

              private void stopRepeat() {
                  if (repeatRunnable != null) {
                      repeatHandler.removeCallbacks(repeatRunnable);
                      repeatRunnable = null;
                  }
              }

              private void attachBackspaceListener(Button delBtn) {
                  delBtn.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          int action = event.getAction();
                          if (action == MotionEvent.ACTION_DOWN) {
                              vibrate();
                              handleBackspace();
                              stopRepeat();
                              repeatRunnable = new Runnable() {
                                  @Override
                                  public void run() {
                                      vibrate();
                                      handleBackspace();
                                      repeatHandler.postDelayed(this, 50);
                                  }
                              };
                              repeatHandler.postDelayed(repeatRunnable, 350);
                              return true;
                          } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                              stopRepeat();
                              return true;
                          }
                          return false;
                      }
                  });
              }

              @Override
              public View onCreateInputView() {
                  loadThemeColors();

                  rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setBackgroundColor(colorBg);
                  rootLayout.setPadding(dp(4), dp(4), dp(4), dp(6));

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(0, 0, 0, dp(4));

                  topBar.addView(createModeButton("Singlish", "singlish"));
                  topBar.addView(createModeButton("සිංහල", "sinhala"));
                  topBar.addView(createModeButton("ABC", "eng"));
                  topBar.addView(createModeButton("?123", "num"));
                  topBar.addView(createAppButton());
                  topBar.addView(createGlobeButton());

                  rootLayout.addView(topBar);

                  HorizontalScrollView scroll = new HorizontalScrollView(this);
                  scroll.setHorizontalScrollBarEnabled(false);
                  candidateLayout = new LinearLayout(this);
                  candidateLayout.setOrientation(LinearLayout.HORIZONTAL);
                  candidateLayout.setGravity(Gravity.CENTER_VERTICAL);
                  candidateLayout.setPadding(0, dp(2), 0, dp(4));
                  scroll.addView(candidateLayout);
                  rootLayout.addView(scroll);

                  keypadLayout = new LinearLayout(this);
                  keypadLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.addView(keypadLayout);

                  refreshKeypad();
                  updateSuggestions();

                  return rootLayout;
              }

              private View createModeButton(final String label, final String modeName) {
                  Button btn = new Button(this);
                  btn.setText(label);
                  btn.setTextSize(12);
                  btn.setPadding(dp(8), dp(4), dp(8), dp(4));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  lp.setMargins(dp(2), 0, dp(2), 0);
                  btn.setLayoutParams(lp);

                  boolean active = modeName.equals(currentMode);
                  styleButton(btn, active ? colorPrimary : colorKeyBg, active ? colorBg : Color.parseColor("#94A3B8"));

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          if (buffer.length() > 0) {
                              InputConnection ic = getCurrentInputConnection();
                              if (ic != null) {
                                  ic.finishComposingText();
                              }
                              buffer.setLength(0);
                          }
                          currentMode = modeName;
                          refreshKeypad();
                          updateSuggestions();
                      }
                  });
                  return btn;
              }

              private View createAppButton() {
                  Button btn = new Button(this);
                  btn.setText("⚙️ App");
                  btn.setTextSize(11);
                  btn.setPadding(dp(6), dp(4), dp(6), dp(4));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  lp.setMargins(dp(2), 0, dp(2), 0);
                  btn.setLayoutParams(lp);
                  styleButton(btn, colorKeyBg, Color.parseColor("#94A3B8"));

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          try {
                              Intent intent = new Intent(LankaKeyIME.this, MainActivity.class);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception ignored) {}
                      }
                  });
                  return btn;
              }

              private View createGlobeButton() {
                  Button btn = new Button(this);
