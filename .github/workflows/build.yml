          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:label="@string/app_name"
                      android:icon="@drawable/ic_launcher"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LankaKeyIME"
                      android:label="@string/ime_name"
                      android:icon="@drawable/ic_launcher"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lankakey/keyboard/MainActivity.java
          package com.lankakey.keyboard;

          import android.content.Intent;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus(View.FOCUS_DOWN);

                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void openKeyboardSettings() {
                          try {
                              Intent intent = new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS);
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {
                              try {
                                  startActivity(new Intent(Settings.ACTION_SETTINGS));
                              } catch (Exception ignored) {}
                          }
                      }

                      @JavascriptInterface
                      public void showKeyboardPicker() {
                          try {
                              InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                              if (imm != null) {
                                  imm.showInputMethodPicker();
                              }
                          } catch (Exception ignored) {}
                      }

                      @JavascriptInterface
                      public void setKeyboardTheme(String theme) {
                          try {
                              getSharedPreferences("lankakey_prefs", MODE_PRIVATE)
                                  .edit()
                                  .putString("theme", theme)
                                  .apply();
                          } catch (Exception ignored) {}
                      }
                  }, "AndroidSetup");

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/lankakey/keyboard/LankaKeyIME.java
