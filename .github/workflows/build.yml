name: Build LankaKey Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/lankakey/keyboard
          mkdir -p app/src/main/assets
          cat << 'EOF' > settings.gradle
          rootProject.name = 'LankaKey'
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
              namespace 'com.lankakey.keyboard'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lankakey.keyboard"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:label="LankaKey Sinhala Keyboard"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/lankakey/keyboard/MainActivity.kt
          package com.lankakey.keyboard
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  setContentView(webView)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }
          EOF
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html>
          <head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LankaKey</title><style>body{background:#020617;color:#fff;font-family:sans-serif;padding:16px;text-align:center;}h2{color:#f59e0b;}textarea{width:100%;height:120px;font-size:18px;margin-top:12px;background:#0f172a;color:#fff;border-radius:8px;border:1px solid #334155;padding:8px;}.btn{background:#f59e0b;color:#000;font-weight:bold;border:none;padding:8px 16px;border-radius:6px;font-size:14px;margin:4px;cursor:pointer;}</style></head>
          <body><h2>🇱🇰 LankaKey Sinhala Keyboard</h2><p>Type in Singlish or Sinhala:</p><textarea id="t" placeholder="subha -> සුබ"></textarea><br><button class="btn" onclick="document.getElementById('t').value+='සුබ උදෑසනක් '">සුබ උදෑසනක්</button><button class="btn" onclick="document.getElementById('t').value+='ස්තූතියි '">ස්තූතියි</button><button class="btn" onclick="document.getElementById('t').value+='කොහොමද '">කොහොමද</button></body></html>
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LankaKey-APK
          path: app/build/outputs/apk/debug/*.apk
