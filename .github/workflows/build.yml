            <script>
              let mode = 'phonetic';

              const DICT = {
                "mama": "මම", "mata": "මට", "mage": "මගේ", "oya": "ඔයා", "oyaa": "ඔයා", "api": "අපි",
                "subha": "සුබ", "udhasanak": "උදෑසනක්", "kohomada": "කොහොමද", "sthuthi": "ස්තූතියි",
                "lanka": "ලංකා", "machan": "මචං", "hari": "හරි", "ow": "ඔව්", "ne": "නේ",
                "elakiri": "එළකිරි", "supiri": "සුපිරි"
              };

              const CONSONANTS = {
                "k": "ක", "g": "ග", "ch": "ච", "j": "ජ", "t": "ට", "d": "ඩ", "th": "ත", "dh": "ද",
                "n": "න", "p": "ප", "b": "බ", "m": "ම", "y": "ය", "r": "ර", "l": "ල", "v": "ව",
                "w": "ව", "s": "ස", "h": "හ", "sh": "ශ"
              };

              function transliterateWord(str) {
                if (!str) return '';
                let s = str.toLowerCase();
                if (DICT[s]) return DICT[s];
                let out = '';
                let i = 0;
                while (i < s.length) {
                  let pair = s.substr(i, 2);
                  if (pair === "th") { out += "ත"; i += 2; continue; }
                  if (pair === "dh") { out += "ද"; i += 2; continue; }
                  if (pair === "sh") { out += "ශ"; i += 2; continue; }
                  if (pair === "ch") { out += "ච"; i += 2; continue; }
                  let ch = s[i];
                  if (CONSONANTS[ch]) {
                    let base = CONSONANTS[ch];
                    i++;
                    if (i < s.length) {
                      let next = s[i];
                      if (next === 'a') {
                        if (i + 1 < s.length && s[i+1] === 'a') { out += base + 'ා'; i += 2; }
                        else { out += base; i++; }
                      } else if (next === 'i') {
                        if (i + 1 < s.length && s[i+1] === 'i') { out += base + 'ී'; i += 2; }
                        else { out += base + 'ි'; i++; }
                      } else if (next === 'u') {
                        if (i + 1 < s.length && s[i+1] === 'u') { out += base + 'ූ'; i += 2; }
                        else { out += base + 'ු'; i++; }
                      } else if (next === 'e') {
                        if (i + 1 < s.length && s[i+1] === 'e') { out += base + 'ේ'; i += 2; }
                        else { out += base + 'ෙ'; i++; }
                      } else if (next === 'o') {
                        if (i + 1 < s.length && s[i+1] === 'o') { out += base + 'ෝ'; i += 2; }
                        else { out += base + 'ො'; i++; }
                      } else {
                        out += base + '්';
                      }
                    } else {
                      out += base;
                    }
                  } else {
                    if (ch === 'a') out += 'අ';
                    else if (ch === 'e') out += 'එ';
                    else if (ch === 'i') out += 'ඉ';
                    else if (ch === 'o') out += 'ඔ';
                    else if (ch === 'u') out += 'උ';
                    else out += ch;
                    i++;
                  }
                }
                return out;
              }

              function handleTyping() {
                const el = document.getElementById('main-editor');
                const val = el.value;
                document.getElementById('sms-chars').innerText = val.length;
                document.getElementById('sms-parts').innerText = Math.max(1, Math.ceil(val.length / 70));

                if (mode === 'phonetic') {
                  const words = val.split(/(\s+)/);
                  const lastWord = words[words.length - 1];
                  const sugBar = document.getElementById('sug-bar');
                  if (lastWord && lastWord.trim().length > 0 && /^[a-zA-Z]+$/.test(lastWord)) {
                    const converted = transliterateWord(lastWord);
                    sugBar.innerHTML = '<button class="sug-pill" onclick="acceptSuggestion(\'' + converted + '\')">' + converted + ' ↵</button>' +
                                       '<button class="sug-pill" style="color:#94a3b8;" onclick="acceptSuggestion(\'' + lastWord + '\')">' + lastWord + '</button>';
                  } else {
                    sugBar.innerHTML = '<span style="font-size:11px; color:#64748b;">Singlish phonetic conversion active...</span>';
                  }
                }
              }

              function acceptSuggestion(sinhalaWord) {
                const el = document.getElementById('main-editor');
                const words = el.value.split(/(\s+)/);
                words[words.length - 1] = sinhalaWord;
                el.value = words.join('') + ' ';
                el.focus();
                handleTyping();
              }

              function toggleMode(m) {
                mode = m;
                document.getElementById('mode-phonetic').classList.toggle('active', m === 'phonetic');
                document.getElementById('mode-wijesekara').classList.toggle('active', m === 'wijesekara');
                document.getElementById('wije-container').style.display = m === 'wijesekara' ? 'flex' : 'none';
              }

              function insertChar(c) {
                const el = document.getElementById('main-editor');
                el.value += c;
                el.focus();
                handleTyping();
              }

              function insertBadge(t) {
                const el = document.getElementById('main-editor');
                el.value = el.value ? el.value + ' ' + t : t;
                el.focus();
                handleTyping();
              }

              function copyText() {
                const el = document.getElementById('main-editor');
                if (!el.value) return;
                navigator.clipboard.writeText(el.value).then(() => {
                  alert('Copied to clipboard! (පිටපත් කරගන්නා ලදී)');
                });
              }

              function shareWhatsApp() {
                const el = document.getElementById('main-editor');
                if (!el.value) return;
                const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(el.value);
                window.location.href = url;
              }

              function speakText() {
                const el = document.getElementById('main-editor');
                if (!el.value) return;
                if ('speechSynthesis' in window) {
                  const ut = new SpeechSynthesisUtterance(el.value);
                  ut.lang = 'si-LK';
                  window.speechSynthesis.speak(ut);
                } else {
                  alert('Audio synthesis not supported on this browser.');
                }
              }

              function clearText() {
                document.getElementById('main-editor').value = '';
                handleTyping();
              }

              function callSetup(type) {
                if (type === 'settings') {
                  if (window.AndroidSetup && window.AndroidSetup.openKeyboardSettings) {
                    window.AndroidSetup.openKeyboardSettings();
                  } else {
                    alert("Open Settings -> System -> Languages & Input -> Manage keyboards and enable LankaKey.");
                  }
                } else {
                  if (window.AndroidSetup && window.AndroidSetup.showKeyboardPicker) {
                    window.AndroidSetup.showKeyboardPicker();
                  } else {
                    alert("Tap keyboard icon in navigation bar to select LankaKey.");
                  }
                }
              }

              function setTheme(th) {
                document.body.className = '';
                if (th !== 'default') document.body.classList.add('theme-' + th);
                if (window.AndroidSetup && window.AndroidSetup.setKeyboardTheme) {
                  window.AndroidSetup.setKeyboardTheme(th);
                }
                closeModals();
              }

              function decodeNic() {
                const val = document.getElementById('nic-input').value.trim();
                const res = document.getElementById('nic-result');
                if (val.length !== 10 && val.length !== 12) {
                  res.style.display = 'none';
                  return;
                }
                let year, days, isFemale;
                if (val.length === 10) {
                  year = 1900 + parseInt(val.substring(0, 2), 10);
                  days = parseInt(val.substring(2, 5), 10);
                } else {
                  year = parseInt(val.substring(0, 4), 10);
                  days = parseInt(val.substring(4, 7), 10);
                }
                isFemale = days > 500;
                if (isFemale) days -= 500;
                res.innerHTML = '<div>Birth Year: <strong>' + year + '</strong></div>' +
                                '<div>Gender: <strong>' + (isFemale ? 'Female (කාන්තා)' : 'Male (පුරුෂ)') + '</strong></div>' +
                                '<div>Day of Year: <strong>' + days + '</strong></div>';
                res.style.display = 'flex';
              }

              function openModal(id) {
                document.getElementById('modal-' + id).style.display = 'flex';
              }

              function closeModals() {
                document.querySelectorAll('.modal-backdrop').forEach(m => m.style.display = 'none');
              }
            </script>
          </body>
          </html>
          EOF

      - name: Download Standalone Gradle 8.5
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          chmod +x ./gradle-8.5/bin/gradle

      - name: Build Android APK
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p output-apk
          cp app/build/outputs/apk/debug/*.apk output-apk/LankaKey-Sinhala-Keyboard.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LankaKey-Sinhala-Keyboard-APK
          path: output-apk/LankaKey-Sinhala-Keyboard.apk
