                  btn.setTextSize(11);
                  btn.setPadding(dp(6), dp(4), dp(6), dp(4));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  lp.setMargins(dp(2), 0, dp(2), 0);
                  btn.setLayoutParams(lp);
                  styleButton(btn, colorKeyBg, Color.parseColor("#94A3B8"));

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                          if (imm != null) {
                              imm.showInputMethodPicker();
                          }
                      }
                  });
                  return btn;
              }

              private void styleButton(Button btn, int bgColor, int textColor) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(bgColor);
                  gd.setCornerRadius(dp(8));
                  gd.setStroke(dp(1), colorBorder);
                  btn.setBackground(gd);
                  btn.setTextColor(textColor);
                  btn.setAllCaps(false);
              }

              private void refreshKeypad() {
                  if (keypadLayout == null) return;
                  keypadLayout.removeAllViews();

                  if ("sinhala".equals(currentMode)) {
                      addRow(new String[]{"අ", "ආ", "ඇ", "ඈ", "ඉ", "ඊ", "උ", "ඌ", "එ", "ඒ", "ඔ", "ඕ"});
                      addRow(new String[]{"ක", "ග", "ච", "ජ", "ට", "ඩ", "ණ", "ත", "ද", "න", "ප", "බ"});
                      addRow(new String[]{"ම", "ය", "ර", "ල", "ව", "ස", "හ", "ළ", "ඳ", "ඟ", "ඥ", "ඤ"});
                      addRow(new String[]{"්", "ා", "ැ", "ෑ", "ි", "ී", "ු", "ූ", "ෙ", "ේ", "ෛ", "ො", "ෝ", "ං"});
                      addBottomRow();
                  } else if ("singlish".equals(currentMode)) {
                      addRow(new String[]{"q", "w", "e", "r", "t", "y", "u", "i", "o", "p"});
                      addRow(new String[]{"a", "s", "d", "f", "g", "h", "j", "k", "l"});
                      addShiftRow(new String[]{"z", "x", "c", "v", "b", "n", "m"});
                      addBottomRow();
                  } else if ("eng".equals(currentMode)) {
                      String[] r1 = isShift ? new String[]{"Q","W","E","R","T","Y","U","I","O","P"} : new String[]{"q","w","e","r","t","y","u","i","o","p"};
                      String[] r2 = isShift ? new String[]{"A","S","D","F","G","H","J","K","L"} : new String[]{"a","s","d","f","g","h","j","k","l"};
                      String[] r3 = isShift ? new String[]{"Z","X","C","V","B","N","M"} : new String[]{"z","x","c","v","b","n","m"};
                      addRow(r1);
                      addRow(r2);
                      addShiftRow(r3);
                      addBottomRow();
                  } else if ("num".equals(currentMode)) {
                      addRow(new String[]{"1", "2", "3", "4", "5", "6", "7", "8", "9", "0"});
                      addRow(new String[]{"@", "#", "$", "%", "&", "-", "+", "(", ")", "/"});
                      addRow(new String[]{"*", "\"", "'", ":", ";", "!", "?", ",", "."});
                      addBottomRow();
                  }
              }

              private void addRow(String[] keys) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  row.setPadding(0, dp(2), 0, dp(2));

                  for (final String key : keys) {
                      Button btn = new Button(this);
                      btn.setText(key);
                      btn.setTextSize(15);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          0, dp(44), 1.0f
                      );
                      lp.setMargins(dp(1), 0, dp(1), 0);
                      btn.setLayoutParams(lp);
                      styleButton(btn, colorKeyBg, colorKeyText);

                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              handleKeyInput(key);
                          }
                      });
                      row.addView(btn);
                  }
                  keypadLayout.addView(row);
              }

              private void addShiftRow(String[] keys) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  row.setPadding(0, dp(2), 0, dp(2));

                  Button shiftBtn = new Button(this);
                  shiftBtn.setText(isShift ? "⇪" : "⇧");
                  shiftBtn.setTextSize(14);
                  LinearLayout.LayoutParams shiftLp = new LinearLayout.LayoutParams(0, dp(44), 1.4f);
                  shiftLp.setMargins(dp(1), 0, dp(1), 0);
                  shiftBtn.setLayoutParams(shiftLp);
                  styleButton(shiftBtn, isShift ? colorPrimary : colorKeyBg, isShift ? colorBg : colorKeyText);
                  shiftBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          isShift = !isShift;
                          refreshKeypad();
                      }
                  });
                  row.addView(shiftBtn);

                  for (final String key : keys) {
                      Button btn = new Button(this);
                      btn.setText(key);
                      btn.setTextSize(15);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, dp(44), 1.0f);
                      lp.setMargins(dp(1), 0, dp(1), 0);
                      btn.setLayoutParams(lp);
                      styleButton(btn, colorKeyBg, colorKeyText);

                      btn.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              handleKeyInput(key);
                          }
                      });
                      row.addView(btn);
                  }

                  Button delBtn = new Button(this);
                  delBtn.setText("⌫");
                  delBtn.setTextSize(14);
                  LinearLayout.LayoutParams delLp = new LinearLayout.LayoutParams(0, dp(44), 1.4f);
                  delLp.setMargins(dp(1), 0, dp(1), 0);
                  delBtn.setLayoutParams(delLp);
                  styleButton(delBtn, colorKeyBg, colorKeyText);
                  attachBackspaceListener(delBtn);
                  row.addView(delBtn);

                  keypadLayout.addView(row);
              }

              private void addBottomRow() {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  row.setPadding(0, dp(2), 0, dp(2));

                  Button spaceBtn = new Button(this);
                  spaceBtn.setText("␣ Space (හිස්තැන)");
                  spaceBtn.setTextSize(12);
                  LinearLayout.LayoutParams spaceLp = new LinearLayout.LayoutParams(0, dp(44), 3.2f);
                  spaceLp.setMargins(dp(2), 0, dp(2), 0);
                  spaceBtn.setLayoutParams(spaceLp);
                  styleButton(spaceBtn, colorKeyBg, Color.parseColor("#94A3B8"));
                  spaceBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          handleSpace();
                      }
                  });
                  row.addView(spaceBtn);

                  // Quick delete button on bottom bar for all modes
                  Button delBtn = new Button(this);
                  delBtn.setText("⌫");
                  delBtn.setTextSize(14);
                  LinearLayout.LayoutParams delLp = new LinearLayout.LayoutParams(0, dp(44), 1.3f);
                  delLp.setMargins(dp(2), 0, dp(2), 0);
                  delBtn.setLayoutParams(delLp);
                  styleButton(delBtn, colorKeyBg, colorKeyText);
                  attachBackspaceListener(delBtn);
                  row.addView(delBtn);

                  Button enterBtn = new Button(this);
                  enterBtn.setText("⏎ Enter");
                  enterBtn.setTextSize(12);
                  LinearLayout.LayoutParams enterLp = new LinearLayout.LayoutParams(0, dp(44), 1.7f);
                  enterLp.setMargins(dp(2), 0, dp(2), 0);
                  enterBtn.setLayoutParams(enterLp);
                  styleButton(enterBtn, colorPrimary, colorBg);
                  enterBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          handleEnter();
                      }
                  });
                  row.addView(enterBtn);

                  keypadLayout.addView(row);
              }

              // LIVE COMPOSING TEXT: Updates text box in real-time as user types Singlish
              private void handleKeyInput(String key) {
                  vibrate();
                  if ("singlish".equals(currentMode)) {
                      buffer.append(key);
                      String converted = transliterate(buffer.toString());
                      InputConnection ic = getCurrentInputConnection();
                      if (ic != null) {
                          ic.setComposingText(converted, 1);
                      }
                      updateSuggestions();
                  } else {
                      commitText(key);
                  }
              }

              private void handleSpace() {
                  vibrate();
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      if ("singlish".equals(currentMode) && buffer.length() > 0) {
                          ic.finishComposingText();
                      }
                      ic.commitText(" ", 1);
                  }
                  buffer.setLength(0);
                  updateSuggestions();
              }

              private void handleEnter() {
                  vibrate();
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      if ("singlish".equals(currentMode) && buffer.length() > 0) {
                          ic.finishComposingText();
                      }
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER));
                      ic.sendKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_ENTER));
                  }
                  buffer.setLength(0);
                  updateSuggestions();
              }

              private void handleBackspace() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;

                  if ("singlish".equals(currentMode) && buffer.length() > 0) {
                      buffer.deleteCharAt(buffer.length() - 1);
                      if (buffer.length() > 0) {
                          String converted = transliterate(buffer.toString());
                          ic.setComposingText(converted, 1);
                      } else {
                          ic.setComposingText("", 1);
                          ic.finishComposingText();
                      }
                      updateSuggestions();
                  } else {
                      CharSequence sel = ic.getSelectedText(0);
                      if (sel != null && sel.length() > 0) {
                          ic.commitText("", 1);
                      } else {
                          ic.deleteSurroundingText(1, 0);
                      }
                  }
              }

              private void commitText(String text) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null && text != null) {
                      ic.commitText(text, 1);
                  }
              }

              private void updateSuggestions() {
                  if (candidateLayout == null) return;
                  candidateLayout.removeAllViews();

                  if (buffer.length() == 0) {
                      // Quick Sri Lankan badges bar when not actively typing a Singlish word
                      String[] quickBadges = new String[]{
                          "🇱🇰 LankaKey", "සුබ උදෑසනක්! ☀️", "ස්තූතියි! 🙏", "කොහොමද? 😊",
                          "හරි මචං 🔥", "මම එන්නම් 👍", "එළකිරි ✨", "සුබ පැතුම්! 🎉", "ඕකේ 👍"
                      };
                      for (final String badge : quickBadges) {
                          Button b = new Button(this);
                          b.setText(badge);
                          b.setTextSize(11);
                          b.setPadding(dp(8), dp(2), dp(8), dp(2));
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, dp(30)
                          );
                          lp.setMargins(dp(2), 0, dp(2), 0);
                          b.setLayoutParams(lp);
                          styleButton(b, colorKeyBg, Color.parseColor("#94A3B8"));
                          b.setOnClickListener(new View.OnClickListener() {
                              @Override
                              public void onClick(View v) {
                                  vibrate();
                                  commitText(badge + " ");
                              }
                          });
                          candidateLayout.addView(b);
                      }
                      return;
                  }

                  String raw = buffer.toString().toLowerCase();
                  final String converted = transliterate(raw);

                  // Highlighted Converted Sinhala Chip
                  Button chip = new Button(this);
                  chip.setText(converted + " ↵");
                  chip.setTextSize(14);
                  chip.setPadding(dp(12), dp(4), dp(12), dp(4));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  lp.setMargins(dp(2), 0, dp(4), 0);
                  chip.setLayoutParams(lp);
                  styleButton(chip, colorPrimary, colorBg);
                  chip.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          InputConnection ic = getCurrentInputConnection();
                          if (ic != null) {
                              ic.commitText(converted + " ", 1);
                          }
                          buffer.setLength(0);
                          updateSuggestions();
                      }
                  });
                  candidateLayout.addView(chip);

                  // Raw English word chip
                  Button rawChip = new Button(this);
                  rawChip.setText(buffer.toString());
                  rawChip.setTextSize(12);
                  rawChip.setPadding(dp(8), dp(4), dp(8), dp(4));
                  LinearLayout.LayoutParams rlp = new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  rlp.setMargins(dp(2), 0, dp(4), 0);
                  rawChip.setLayoutParams(rlp);
                  styleButton(rawChip, colorKeyBg, Color.parseColor("#94A3B8"));
                  rawChip.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          vibrate();
                          InputConnection ic = getCurrentInputConnection();
                          if (ic != null) {
                              ic.commitText(buffer.toString() + " ", 1);
                          }
                          buffer.setLength(0);
                          updateSuggestions();
                      }
                  });
                  candidateLayout.addView(rawChip);
              }

              private String transliterate(String str) {
                  if (str == null || str.isEmpty()) return "";
                  String s = str.toLowerCase();
                  if (DICT.containsKey(s)) return DICT.get(s);

                  StringBuilder sb = new StringBuilder();
                  int i = 0;
                  while (i < s.length()) {
                      if (i + 1 < s.length()) {
                          String pair = s.substring(i, i + 2);
                          if ("th".equals(pair)) { sb.append("ත"); i += 2; continue; }
                          if ("dh".equals(pair)) { sb.append("ද"); i += 2; continue; }
                          if ("sh".equals(pair)) { sb.append("ශ"); i += 2; continue; }
                          if ("ch".equals(pair)) { sb.append("ච"); i += 2; continue; }
                          if ("ph".equals(pair)) { sb.append("ෆ"); i += 2; continue; }
                          if ("kh".equals(pair)) { sb.append("ඛ"); i += 2; continue; }
                          if ("gh".equals(pair)) { sb.append("ඝ"); i += 2; continue; }
                          if ("bh".equals(pair)) { sb.append("භ"); i += 2; continue; }
                          if ("gn".equals(pair)) { sb.append("ඥ"); i += 2; continue; }
                          if ("kn".equals(pair)) { sb.append("ඤ"); i += 2; continue; }
                      }
                      String ch = String.valueOf(s.charAt(i));
                      if (CONSONANTS.containsKey(ch)) {
                          String base = CONSONANTS.get(ch);
                          i++;
                          if (i < s.length()) {
                              char next = s.charAt(i);
                              if (next == 'a') {
                                  if (i + 1 < s.length && s.charAt(i + 1) == 'a') { sb.append(base).append("ා"); i += 2; }
                                  else if (i + 1 < s.length && s.charAt(i + 1) == 'e') {
                                      if (i + 2 < s.length && s.charAt(i + 2) == 'e') { sb.append(base).append("ෑ"); i += 3; }
                                      else { sb.append(base).append("ැ"); i += 2; }
                                  } else { sb.append(base); i++; }
                              } else if (next == 'i') {
                                  if (i + 1 < s.length && s.charAt(i + 1) == 'i') { sb.append(base).append("ී"); i += 2; }
                                  else { sb.append(base).append("ි"); i++; }
                              } else if (next == 'u') {
                                  if (i + 1 < s.length && s.charAt(i + 1) == 'u') { sb.append(base).append("ූ"); i += 2; }
                                  else { sb.append(base).append("ු"); i++; }
                              } else if (next == 'e') {
                                  if (i + 1 < s.length && s.charAt(i + 1) == 'e') { sb.append(base).append("ී"); i += 2; }
                                  else if (i + 1 < s.length && s.charAt(i + 1) == 'i') { sb.append(base).append("ේ"); i += 2; }
                                  else { sb.append(base).append("ෙ"); i++; }
                              } else if (next == 'o') {
                                  if (i + 1 < s.length && s.charAt(i + 1) == 'o') { sb.append(base).append("ූ"); i += 2; }
                                  else { sb.append(base).append("ො"); i++; }
                              } else {
                                  sb.append(base).append("්");
                              }
                          } else {
                              sb.append(base);
                          }
                      } else {
                          if ("a".equals(ch)) {
                              if (i + 1 < s.length && s.charAt(i + 1) == 'a') { sb.append("ආ"); i += 2; }
                              else if (i + 1 < s.length && s.charAt(i + 1) == 'e') { sb.append("ඇ"); i += 2; }
                              else { sb.append("අ"); i++; }
                          } else if ("e".equals(ch)) {
                              if (i + 1 < s.length && s.charAt(i + 1) == 'e') { sb.append("ඊ"); i += 2; }
                              else { sb.append("එ"); i++; }
                          } else if ("i".equals(ch)) {
                              if (i + 1 < s.length && s.charAt(i + 1) == 'i') { sb.append("ඊ"); i += 2; }
                              else { sb.append("ඉ"); i++; }
                          } else if ("o".equals(ch)) {
                              if (i + 1 < s.length && s.charAt(i + 1) == 'o') { sb.append("ඌ"); i += 2; }
                              else { sb.append("ඔ"); i++; }
                          } else if ("u".equals(ch)) {
                              if (i + 1 < s.length && s.charAt(i + 1) == 'u') { sb.append("ඌ"); i += 2; }
                              else { sb.append("උ"); i++; }
                          } else {
                              sb.append(ch);
                              i++;
                          }
                      }
                  }
                  return sb.toString();
              }
          }
